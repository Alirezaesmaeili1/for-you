<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>یه سوال مهم... 💕</title>
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #fff0f5 0%, #ffe4e1 50%, #ffdde1 100%);
      --card-bg: rgba(255, 255, 255, 0.92);
      --primary: #ff4d79;
      --primary-hover: #ff2a60;
      --secondary: #f3f4f6;
      --text-main: #2d1b22;
      --text-muted: #7a5c68;
      --shadow: 0 20px 50px rgba(255, 77, 121, 0.18);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Vazirmatn', system-ui, -apple-system, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      background: var(--bg-gradient);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow-x: hidden;
      color: var(--text-main);
    }

    /* افکت جرقه‌ها و قلب‌های لمس صفحه */
    .click-sparkle {
      position: fixed;
      pointer-events: none;
      user-select: none;
      z-index: 9999;
      font-size: 1.25rem;
      transform: translate(-50%, -50%);
      animation: sparkleFloat 0.85s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes sparkleFloat {
      0% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(0.4) rotate(0deg);
      }
      50% {
        opacity: 1;
      }
      100% {
        opacity: 0;
        transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.2) rotate(var(--rot));
      }
    }

    /* کارت اصلی */
    .card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      width: 100%;
      max-width: 440px;
      border-radius: 30px;
      padding: 36px 28px;
      text-align: center;
      box-shadow: var(--shadow);
      border: 1px solid rgba(255, 255, 255, 0.8);
      position: relative;
      z-index: 10;
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .card.card-bounce {
      animation: cardSpring 0.55s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes cardSpring {
      0% { transform: scale(0.96); }
      50% { transform: scale(1.02); }
      100% { transform: scale(1); }
    }

    /* انیمیشن‌های ورود و خروج مراحل */
    .step {
      display: none;
    }

    .step.active {
      display: block;
      animation: fadeSlideIn 0.5s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .step.leaving {
      display: block;
      animation: fadeSlideOut 0.3s cubic-bezier(0.4, 0, 1, 1) forwards;
    }

    @keyframes fadeSlideIn {
      0% {
        opacity: 0;
        transform: translateY(22px) scale(0.95);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes fadeSlideOut {
      0% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
      100% {
        opacity: 0;
        transform: translateY(-18px) scale(0.95);
      }
    }

    /* ایموجی واکنشی بزرگ */
    .emoji-wrapper {
      height: 110px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
    }

    .emoji-face {
      font-size: 5.2rem;
      line-height: 1;
      display: inline-block;
      user-select: none;
      filter: drop-shadow(0 10px 16px rgba(255, 77, 121, 0.2));
      transition: transform 0.25s ease;
    }

    .anim-float {
      animation: emojiFloat 2.8s ease-in-out infinite;
    }

    .anim-wobble {
      animation: emojiWobble 0.5s ease-in-out;
    }

    .anim-sad-tilt {
      animation: emojiSadTilt 1.6s ease-in-out infinite;
    }

    .anim-shake {
      animation: emojiShake 0.45s ease-in-out infinite;
    }

    .anim-bounce-joy {
      animation: emojiJoy 0.65s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
    }

    @keyframes emojiFloat {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-8px) rotate(4deg); }
    }

    @keyframes emojiWobble {
      0%, 100% { transform: scale(1) rotate(0deg); }
      25% { transform: scale(1.12) rotate(-10deg); }
      50% { transform: scale(1.12) rotate(10deg); }
      75% { transform: scale(1.06) rotate(-5deg); }
    }

    @keyframes emojiSadTilt {
      0%, 100% { transform: rotate(-6deg) translateY(0); }
      50% { transform: rotate(6deg) translateY(4px); }
    }

    @keyframes emojiShake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-5px) rotate(-4deg); }
      75% { transform: translateX(5px) rotate(4deg); }
    }

    @keyframes emojiJoy {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-14px) scale(1.14); }
    }

    h1 {
      font-size: 1.55rem;
      font-weight: 800;
      margin-bottom: 10px;
      line-height: 1.4;
    }

    p.subtitle {
      font-size: 0.98rem;
      color: var(--text-muted);
      margin-bottom: 24px;
      line-height: 1.6;
      min-height: 28px;
    }

    /* دکمه‌های مرحله اول */
    .btn-group {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin-top: 8px;
    }

    button {
      border: none;
      border-radius: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .btn-yes {
      background: var(--primary);
      color: white;
      padding: 14px 32px;
      font-size: 1.1rem;
      box-shadow: 0 8px 20px rgba(255, 77, 121, 0.35);
    }

    .btn-yes:hover {
      background: var(--primary-hover);
      transform: translateY(-2px);
    }

    .btn-no {
      background: var(--secondary);
      color: var(--text-muted);
      padding: 14px 26px;
      font-size: 1rem;
    }

    .btn-no:hover {
      background: #e5e7eb;
    }

    /* انتخاب تاریخ و ساعت */
    .input-group {
      text-align: right;
      margin-bottom: 18px;
    }

    .input-group label {
      display: block;
      font-size: 0.9rem;
      font-weight: 700;
      margin-bottom: 8px;
      color: var(--text-main);
    }

    .input-group input {
      width: 100%;
      padding: 14px 16px;
      border-radius: 16px;
      border: 2px solid #ffe0e8;
      background: #fff9fb;
      font-size: 1rem;
      color: var(--text-main);
      outline: none;
      transition: border-color 0.2s;
    }

    .input-group input:focus {
      border-color: var(--primary);
    }

    /* شبکه انتخاب غذا */
    .food-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
      margin-bottom: 24px;
    }

    .food-item {
      background: #fff9fb;
      border: 2px solid #ffe0e8;
      border-radius: 20px;
      padding: 18px 12px;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .food-item:hover {
      transform: translateY(-4px) scale(1.02);
      border-color: #ffb3c6;
      box-shadow: 0 8px 18px rgba(255, 77, 121, 0.12);
    }

    .food-item.selected {
      background: #fff0f4;
      border-color: var(--primary);
      box-shadow: 0 8px 20px rgba(255, 77, 121, 0.22);
      transform: scale(1.04);
    }

    .food-emoji {
      font-size: 2.5rem;
    }

    .food-name {
      font-weight: 700;
      font-size: 1rem;
    }

    .btn-next {
      width: 100%;
      background: var(--primary);
      color: white;
      padding: 15px;
      font-size: 1.05rem;
      box-shadow: 0 8px 20px rgba(255, 77, 121, 0.3);
    }

    .btn-next:hover {
      background: var(--primary-hover);
      transform: translateY(-2px);
    }

    /* باکس خلاصه نهایی */
    .summary-box {
      background: #fff5f8;
      border: 2px dashed #ffb3c6;
      border-radius: 20px;
      padding: 18px;
      margin: 20px 0;
      line-height: 1.9;
      font-size: 1.02rem;
    }

    .summary-highlight {
      color: var(--primary);
      font-weight: 800;
    }

    .btn-copy {
      background: #2d1b22;
      color: white;
      padding: 12px 22px;
      font-size: 0.92rem;
      border-radius: 14px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn-copy:hover {
      background: #462b35;
      transform: translateY(-2px);
    }

    /* کنفتی جشن */
    .confetti {
      position: fixed;
      width: 10px;
      height: 10px;
      top: -10px;
      z-index: 9998;
      pointer-events: none;
      animation: confettiFall linear forwards;
    }

    @keyframes confettiFall {
      to {
        transform: translateY(105vh) rotate(720deg);
      }
    }
  </style>
</head>
<body>

  <div class="card" id="mainCard">
    <!-- مرحله ۱: پیشنهاد -->
    <div class="step active" id="step1">
      <div class="emoji-wrapper">
        <span class="emoji-face anim-float" id="emoji1">🥰</span>
      </div>
      <h1>با من میای بیرون؟ 🥺💕</h1>
      <p class="subtitle" id="noMessage">قول میدم خیلی خوش بگذره...</p>
      <div class="btn-group">
        <button class="btn-yes" id="yesBtn" onclick="acceptDate()">آره 💕</button>
        <button class="btn-no" id="noBtn" onclick="rejectDate()">نه</button>
      </div>
    </div>

    <!-- مرحله ۲: انتخاب تاریخ و ساعت -->
    <div class="step" id="step2">
      <div class="emoji-wrapper">
        <span class="emoji-face anim-float">📅✨</span>
      </div>
      <h1>ایول! کی بریم؟ 😍</h1>
      <p class="subtitle">روز و ساعتی که برات راحت‌تره رو انتخاب کن</p>
      <div class="input-group">
        <label for="dateInput">انتخاب تاریخ:</label>
        <input type="date" id="dateInput" />
      </div>
      <div class="input-group">
        <label for="timeInput">انتخاب ساعت:</label>
        <input type="time" id="timeInput" value="19:30" />
      </div>
      <button class="btn-next" onclick="goToFood()">مرحله بعدی ➔</button>
    </div>

    <!-- مرحله ۳: انتخاب غذا -->
    <div class="step" id="step3">
      <div class="emoji-wrapper">
        <span class="emoji-face anim-float">🍽️💕</span>
      </div>
      <h1>چی بخوریم؟ 😋</h1>
      <p class="subtitle">هر کدوم رو بیشتر هوس کردی انتخاب کن</p>
      <div class="food-grid">
        <div class="food-item selected" onclick="selectFood(this, 'قهوه ☕')">
          <span class="food-emoji">☕</span>
          <span class="food-name">قهوه</span>
        </div>
        <div class="food-item" onclick="selectFood(this, 'پیتزا 🍕')">
          <span class="food-emoji">🍕</span>
          <span class="food-name">پیتزا</span>
        </div>
        <div class="food-item" onclick="selectFood(this, 'گوشت 🥩')">
          <span class="food-emoji">🥩</span>
          <span class="food-name">گوشت</span>
        </div>
        <div class="food-item" onclick="selectFood(this, 'پاستا 🍝')">
          <span class="food-emoji">🍝</span>
          <span class="food-name">پاستا</span>
        </div>
      </div>
      <button class="btn-next" onclick="finishDate()">تایید نهایی 💖</button>
    </div>

    <!-- مرحله ۴: صفحه پایانی -->
    <div class="step" id="step4">
      <div class="emoji-wrapper">
        <span class="emoji-face anim-bounce-joy">🎉💖</span>
      </div>
      <h1>قرارمون قطعی شد! 😍✨</h1>
      <p class="subtitle">بی‌صبرانه منتظر دیدنت هستم</p>
      <div class="summary-box" id="summaryText"></div>
      <button class="btn-copy" onclick="copyResult(this)">📋 کپی کردن جزئیات قرار</button>
    </div>
  </div>

  <script>
    // جرقه‌ها و قلب‌های ظریف هنگام کلیک یا لمس صفحه
    const sparkleIcons = ['✨', '💖', '💕', '🌸', '💫'];
    document.addEventListener('pointerdown', (e) => {
      for (let i = 0; i < 4; i++) {
        const spark = document.createElement('span');
        spark.className = 'click-sparkle';
        spark.textContent = sparkleIcons[Math.floor(Math.random() * sparkleIcons.length)];
        spark.style.left = e.clientX + 'px';
        spark.style.top = e.clientY + 'px';

        const angle = Math.random() * Math.PI * 2;
        const distance = 30 + Math.random() * 45;
        spark.style.setProperty('--dx', Math.cos(angle) * distance + 'px');
        spark.style.setProperty('--dy', (Math.sin(angle) * distance - 20) + 'px');
        spark.style.setProperty('--rot', (Math.random() * 90 - 45) + 'deg');

        document.body.appendChild(spark);
        setTimeout(() => spark.remove(), 850);
      }
    });

    // تنظیم تاریخ پیش‌فرض به فردا
    const dateInput = document.getElementById('dateInput');
    const tomorrow = new Date();
    tomorrow.setDate(tomorrow.getDate() + 1);
    dateInput.value = tomorrow.toISOString().split('T')[0];

    // واکنش‌های دکمه نه و ایموجی‌ها
    let noCount = 0;
    const noStates = [
      { text: 'مطمئنی؟ یکم بیشتر فکر کن! 🥺', emoji: '🥺', anim: 'anim-wobble' },
      { text: 'واقعا دلت میاد بگی نه؟ 😢', emoji: '😢', anim: 'anim-sad-tilt' },
      { text: 'الان گریم می‌گیره ها... 😭', emoji: '😭', anim: 'anim-shake' },
      { text: 'قلبم شکست... یه فرصت بده 💔', emoji: '💔', anim: 'anim-sad-tilt' },
      { text: 'دیگه چاره‌ای نداری جز زدن آره! 🙏🥺', emoji: '🙏🥺', anim: 'anim-shake' }
    ];

    function rejectDate() {
      const state = noStates[Math.min(noCount, noStates.length - 1)];
      document.getElementById('noMessage').textContent = state.text;

      const emojiEl = document.getElementById('emoji1');
      emojiEl.textContent = state.emoji;
      emojiEl.className = 'emoji-face ' + state.anim;

      noCount++;
      const yesBtn = document.getElementById('yesBtn');
      const currentScale = 1 + noCount * 0.22;
      yesBtn.style.transform = `scale(${Math.min(currentScale, 2.3)})`;
      yesBtn.style.margin = `${noCount * 6}px ${noCount * 10}px`;
    }

    function switchStep(fromId, toId) {
      const fromEl = document.getElementById(fromId);
      const toEl = document.getElementById(toId);
      const card = document.getElementById('mainCard');

      fromEl.classList.add('leaving');
      setTimeout(() => {
        fromEl.classList.remove('active', 'leaving');
        toEl.classList.add('active');
        card.classList.remove('card-bounce');
        void card.offsetWidth;
        card.classList.add('card-bounce');
      }, 280);
    }

    function acceptDate() {
      const emojiEl = document.getElementById('emoji1');
      emojiEl.textContent = '🤩';
      emojiEl.className = 'emoji-face anim-bounce-joy';

      setTimeout(() => {
        switchStep('step1', 'step2');
      }, 450);
    }

    let selectedFood = 'قهوه ☕';

    function selectFood(element, foodName) {
      document.querySelectorAll('.food-item').forEach(el => el.classList.remove('selected'));
      element.classList.add('selected');
      selectedFood = foodName;
    }

    function goToFood() {
      if (!dateInput.value) {
        alert('لطفاً اول تاریخ رو انتخاب کن 💕');
        return;
      }
      switchStep('step2', 'step3');
    }

    let finalMessagePlain = '';

    function finishDate() {
      const rawDate = new Date(dateInput.value + 'T00:00:00');
      const persianDate = new Intl.DateTimeFormat('fa-IR', {
        weekday: 'long',
        day: 'numeric',
        month: 'long'
      }).format(rawDate);

      const timeVal = document.getElementById('timeInput').value || '۱۹:۳۰';

      document.getElementById('summaryText').innerHTML = `
        📅 تاریخ: <span class="summary-highlight">${persianDate}</span><br>
        ⏰ ساعت: <span class="summary-highlight">${timeVal}</span><br>
        🍽️ انتخاب ما: <span class="summary-highlight">${selectedFood}</span>
      `;

      finalMessagePlain = `قرارمون قطعی شد! 😍💕\n📅 تاریخ: ${persianDate}\n⏰ ساعت: ${timeVal}\n🍽️ انتخاب من: ${selectedFood}`;

      switchStep('step3', 'step4');
      launchConfetti();
    }

    function copyResult(btn) {
      navigator.clipboard.writeText(finalMessagePlain).then(() => {
        const originalText = btn.textContent;
        btn.textContent = '✅ کپی شد! حالا برام بفرست';
        setTimeout(() => {
          btn.textContent = originalText;
        }, 2500);
      });
    }

    function launchConfetti() {
      const colors = ['#ff4d79', '#ff85a2', '#ffb3c6', '#ffd166', '#06d6a0', '#a78bfa'];
      for (let i = 0; i < 65; i++) {
        const conf = document.createElement('div');
        conf.className = 'confetti';
        conf.style.left = Math.random() * 100 + 'vw';
        conf.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
        conf.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
        conf.style.animationDuration = (2 + Math.random() * 2.5) + 's';
        conf.style.animationDelay = (Math.random() * 0.4) + 's';
        document.body.appendChild(conf);
        setTimeout(() => conf.remove(), 4800);
      }
    }
  </script>
</body>
</html>
